name: Docs checks

# Pull requests only. Nothing here runs on pushes to main, so a merge never
# re-runs the same checks the PR already had to pass.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Structure and prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both scripts are dependency-free, so there is nothing to install.
      - name: Structure (navigation, orphans, self-hosting language)
        run: node scripts/check-docs.mjs

      # always() so a structural failure still shows the prose report in the
      # same run instead of hiding it behind the first red step.
      - name: Prose (AI markers, typos, naming, markdown mechanics)
        if: always()
        run: node scripts/check-prose.mjs

  links:
    name: Broken links
    runs-on: ubuntu-latest
    # Informational: pages that are linked but not written yet are a known,
    # tracked state, so this reports without blocking the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes mint@4 broken-links
